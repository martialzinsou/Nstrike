<!--
  Nstrike — logo (wordmark style Microsoft).
  Auteur : Martial Zinsou
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" width="760" height="152">
  <!-- Wordmark style Microsoft : texte noir + carreau 4 couleurs (Windows 8), comme le logo "écrit" -->
  <g>
    <!-- Le carreau : fenêtre 2x2 aux couleurs Microsoft, aligné sur la hauteur du texte -->
    <rect x="2"  y="17" width="22" height="22" rx="3" fill="#F25022"/>
    <rect x="28" y="17" width="22" height="22" rx="3" fill="#7FBA00"/>
    <rect x="2"  y="43" width="22" height="22" rx="3" fill="#00A4EF"/>
    <rect x="28" y="43" width="22" height="22" rx="3" fill="#FFB900"/>

    <!-- Le mot "Nstrike" -->
    <text x="62" y="57" font-family="Segoe UI, Arial Black, Helvetica, Arial, sans-serif"
          font-size="46" font-weight="700" fill="#252525" letter-spacing="-1.5">Nstrike</text>
  </g>
</svg>